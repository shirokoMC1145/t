name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: |
          dkp-pacman -S --noconfirm 3ds-examples || true
          cp /opt/devkitpro/examples/3ds/templates/application/Makefile .
          sed -i 's/^LIBS.*/LIBS := -lctru -lm/' Makefile
          make
      - uses: actions/upload-artifact@v4
        with:
          name: ehviewer3ds
          path: "*.3dsx"